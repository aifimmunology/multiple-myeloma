# environment.yml for starCAT
name: /home/workspace/environment/starcat/

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.9
  - scikit-learn=1.3.2
  - pandas
  - numpy
  - scipy
  - pyyaml
  - requests
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - scanpy=1.9.3
  - anndata=0.9.2
  - pip
  - pip:
    - starcatpy
    - cnmf

prefix: /home/workspace/environment/starcat/